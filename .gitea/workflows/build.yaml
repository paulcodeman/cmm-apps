# Auto-build for cmm_apps: compile every C-- program on push and PR,
# and fail if any program stops compiling. The compiler is built from
# KolibriOS/cmm, so a compiler change that breaks a program shows up
# here before it is bumped into the OS.

name: 'Build C-- programs'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: 'Build (${{ matrix.lang }})'
    runs-on: kolibri-toolchain
    # build each language variant in parallel; don't cancel the others on a failure
    strategy:
      fail-fast: false
      matrix:
        lang: [LANG_ENG, LANG_RUS]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Cloned and installed outside the workspace: the compiler repo carries a
      # Tupfile.lua of its own, and build.sh compiles every Tupfile.lua it finds
      # under the checkout. Paths carry the matrix key so the two language jobs
      # never share a directory on the runner.
      - name: Build and install C--
        env:
          BIN: /tmp/cmm-bin-${{ matrix.lang }}
          SRC: /tmp/cmm-src-${{ matrix.lang }}
        run: |
          set -eu
          rm -rf "$SRC" "$BIN"
          git clone --depth 1 https://git.kolibrios.org/KolibriOS/cmm.git "$SRC"
          make -C "$SRC" -f Makefile.lin32
          mkdir -p "$BIN"
          install -m 755 "$SRC/c--" "$BIN/c--"
          # the compiler looks for c--.ini in the current directory and then in
          # each PATH entry - never beside its own executable - so the config
          # has to go into a PATH directory or the build silently uses defaults
          install -m 644 "$SRC/c--.ini" "$BIN/c--.ini"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Build all C-- programs
        run: sh build.sh ${{ matrix.lang }}

      # publish the compiled .com files so they can be downloaded from the
      # run's Summary page; upload even on failure to keep partial output
      - name: Upload built programs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cmm-programs-${{ matrix.lang }}
          path: dist
          retention-days: 14
